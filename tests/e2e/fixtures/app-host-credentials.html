<!doctype html>
<!-- Host page exercising the runtime credentials bridge (docs/host-credentials.md).
     Its environment declares NO auth.bearerAuth: the void is what the provider
     below fills. The provider is inline and deterministic — it hands out
     `host-token-N`, incrementing on every call, so a test can tell a refresh
     from a cache hit by reading the Authorization header alone.

     Two registrations on purpose, in the two shapes §2 documents: a classic
     script (runs BEFORE any module, so `window.apidoc` cannot exist yet — it
     waits for `apidoc:ready`) and a module script after the app tag (which
     finds the global already there). The classic one only records that the
     event fired; the module one registers the provider. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>E2E — ApiGlow (host credentials)</title>
  </head>
  <body>
    <script id="api-doc-config" type="application/json">
    {
      "openapi": { "url": "/tests/e2e/fixtures/e2e-api.json" },
      "theme": { "default": "apiglow", "available": ["apiglow", "apiglow-dark", "light", "dark"] },
      "language": { "default": "en", "available": ["en", "fr"] },
      "branding": { "productName": "E2E Docs" },
      "environments": [
        {
          "name": "e2e",
          "baseUrl": "https://api.e2e.test/v1",
          "variables": {
            "token": { "value": "tok-123", "sensitive": false }
          }
        }
      ]
    }
    </script>
    <script>
      // Classic script: it executes before every module, so the global is not
      // there yet and the event is the only way in.
      window.__hostCreds = { ready: false, calls: [], issued: 0 }
      document.addEventListener('apidoc:ready', (event) => {
        window.__hostCreds.ready = !!event.detail?.registerCredentialsProvider
      })
    </script>
    <script src="/npm/apiglow@current/dist/app.js" type="module"></script>
    <script type="module">
      const probe = window.__hostCreds
      probe.globalAtModuleTime = !!window.apidoc
      window.apidoc.registerCredentialsProvider((ctx) => {
        probe.calls.push({ specId: ctx.specId, reason: ctx.reason, schemeName: ctx.schemeName })
        // `frozen` is the ×1-cap probe: the provider then answers with the same
        // token it already gave, which must NOT trigger a second replay.
        if (probe.frozen) return { bearerAuth: `host-token-${probe.issued}` }
        probe.issued += 1
        return { bearerAuth: `host-token-${probe.issued}` }
      })
    </script>
  </body>
</html>
