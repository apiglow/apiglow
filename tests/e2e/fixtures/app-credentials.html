<!doctype html>
<!-- Variant of app.html whose only difference is `tryIt.requestCredentials`:
     the cookie-authenticated install. What the flag decides is invisible in the
     DOM — only the bytes on the wire tell the two configurations apart. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>E2E — ApiGlow (credentials: include)</title>
  </head>
  <body>
    <script id="api-doc-config" type="application/json">
    {
      "openapi": { "url": "/tests/e2e/fixtures/e2e-api.json" },
      "theme": { "default": "light", "available": ["light", "dark"] },
      "language": { "default": "en", "available": ["en", "fr"] },
      "branding": { "productName": "E2E Docs" },
      "environments": [
        {
          "name": "e2e",
          "baseUrl": "https://api.e2e.test/v1",
          "variables": {
            "token": { "value": "tok-123", "sensitive": false },
            "auth.bearerAuth": { "value": "e2e-bearer-token", "sensitive": true }
          }
        }
      ],
      "tryIt": { "requestCredentials": "include" }
    }
    </script>
    <script src="/npm/apiglow@current/dist/app.js" type="module"></script>
  </body>
</html>
