<!doctype html>
<!-- Host page for the e2e tests: same mechanics as demo/cdn-install.html (inline
     config + a single <script> pointing to the packed bundle), but with a
     controlled minimal OpenAPI schema — the tests intercept requests to
     https://api.e2e.test at the Playwright level, no real network traffic. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>E2E — ApiGlow</title>
  </head>
  <body>
    <script id="api-doc-config" type="application/json">
    {
      "openapi": { "url": "/tests/e2e/fixtures/e2e-api.json" },
      "theme": { "default": "system", "available": ["apiglow", "apiglow-dark", "light", "dark", "corporate"] },
      "language": { "default": "browser", "available": ["en", "fr"] },
      "branding": {
        "productName": "E2E Docs",
        "footerLinks": [{ "label": "Legal notice", "url": "https://legal.e2e.test" }]
      },
      "environments": [
        {
          "name": "e2e",
          "baseUrl": "https://api.e2e.test/v1",
          "variables": {
            "token": { "value": "tok-123", "sensitive": false },
            "secret": { "value": "sh-456-secret", "sensitive": true },
            "auth.bearerAuth": { "value": "e2e-bearer-token", "sensitive": true }
          }
        }
      ],
      "docsPages": [
        { "title": "Getting started", "url": "/tests/e2e/fixtures/getting-started.md", "slug": "getting-started" }
      ],
      "scenarios": [
        { "id": "onboarding", "title": "Onboarding", "url": "/tests/e2e/fixtures/e2e-scenario.json", "pinned": true }
      ],
      "tryIt": { "proxyUrl": "https://proxy.e2e.test/?url={{target}}" },
      "oauth": { "oauth2Auth": { "clientId": "e2e-client-id" } },
      "history": { "maxEntries": 500, "maxAgeDays": 30 }
    }
    </script>
    <script src="/npm/apiglow@0.1.0/dist/app.js" type="module"></script>
  </body>
</html>
