<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Glow-dot favicon: the brand radial gradient as a soft halo around a
       violet core. Core lightens in dark mode for visibility on dark tab bars. -->
  <style>
    #core { fill: #6d28d9; }
    @media (prefers-color-scheme: dark) {
      #core { fill: #a78bfa; }
    }
  </style>
  <defs>
    <radialGradient id="halo">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#7c3aed" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="32" cy="32" r="30" fill="url(#halo)"/>
  <circle id="core" cx="32" cy="32" r="11"/>
</svg>
