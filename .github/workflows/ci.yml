name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push on a branch makes the previous run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Biome (format + lint)
        run: npx biome ci
      - name: Cross-cutting invariants
        run: npm run check:invariants
      - name: Frozen public surface
        run: npm run check:surface
      - name: Version pins
        run: npm run check:version
      - name: Unit tests with coverage
        # Informational: no threshold gate, the summary is read in the log.
        run: npm run test:coverage
      - name: Build
        run: npm run build
      - name: Distribution invariants
        run: npm run check:dist
      # Syntax tripwire: `build.target` derives from `browserslist`, so a
      # config regression would ship too-new syntax silently — no test sees it,
      # since CI's own browsers are all above the baseline.
      - name: Baseline syntax (es-check)
        run: npm run check:syntax

  e2e:
    name: End-to-end (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      # One engine's failure must not hide the others: the point of the
      # matrix is knowing which engines a change breaks, not just that it does.
      fail-fast: false
      matrix:
        # Keyed on the browser binary, not on the Playwright project, because
        # the mobile projects reuse a binary their desktop sibling installs —
        # three jobs for five projects when all of them run.
        # docs/cross-browser.md §3.3.
        #
        # Chromium is what a push and a PR pay for. The other two engines are
        # a manual run (Actions → CI → Run workflow), because carrying them on
        # every push costs more waiting than the divergences it catches: they
        # are rare, and none of them has ever been the thing that made a push
        # unsafe to land.
        include: >-
          ${{ github.event_name == 'workflow_dispatch'
          && fromJSON('[{"browser":"chromium","projects":"--project=chromium --project=mobile-chrome"},{"browser":"firefox","projects":"--project=firefox"},{"browser":"webkit","projects":"--project=webkit --project=mobile-safari"}]')
          || fromJSON('[{"browser":"chromium","projects":"--project=chromium --project=mobile-chrome"}]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install ${{ matrix.browser }}
        run: npx playwright install --with-deps ${{ matrix.browser }}
      # The Playwright webServer runs build + npm pack itself: the suite always
      # validates the tarball that would be published, never the dev sources.
      - name: Run Playwright
        run: npx playwright test ${{ matrix.projects }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 7

  speech:
    name: What a screen reader says (Orca)
    # Manual run only, like the other two engines: it drives a real Orca in a
    # virtual display and produces a transcript to READ, not a verdict — there
    # is nothing here for a push to wait on, and nothing it could turn red on
    # its own findings. It fails only when the harness itself broke.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # AT-SPI is the platform accessibility API on Linux and the only way to
      # register for a focus event or synthesize a key through the reader
      # (scripts/report-screen-reader.py). Orca reaches it over a session bus of
      # its own, on a display of its own, and speaks through speech-dispatcher —
      # pointed at a `printf`, so nothing is ever said out loud.
      - name: Install Orca and the accessibility stack
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            orca xvfb dbus-x11 at-spi2-core speech-dispatcher \
            python3-gi gir1.2-atspi-2.0 libglib2.0-bin
      # The distribution Firefox is a confined snap, invisible to the
      # accessibility bus; the toolchain's own build is not.
      - name: Install Firefox
        run: npx playwright install --with-deps firefox
      # Server and walk in one step: a background server started in a step of
      # its own does not reliably outlive it.
      - name: Walk the app with Orca
        run: |
          set -o pipefail   # without it `tee` answers for the walk, always 0
          npm run preview:cdn &
          timeout 300 bash -c \
            'until curl -sf -o /dev/null http://localhost:4173/demo/cdn-install.html; do sleep 2; done'
          npm run report:speech | tee orca-transcript.md
      # The transcript is the deliverable, so it is read from the run page
      # rather than dug out of a log — including when the walk died halfway,
      # where what Orca managed to say is exactly what explains the death.
      - name: Publish the transcript
        if: always()
        run: '[ -f orca-transcript.md ] && cat orca-transcript.md >> "$GITHUB_STEP_SUMMARY"'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screen-reader-transcript
          path: orca-transcript.md
          retention-days: 30
